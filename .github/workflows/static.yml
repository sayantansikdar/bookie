# Live demo on GitHub Pages.
# Pages can't host the FastAPI + MLflow model server, so this workflow runs the
# real pipeline (ingest -> preprocess -> train SVD -> evaluate), exports every
# reader's top-5 predictions as JSON, and ships it with a static build of the
# React app (REACT_APP_STATIC=1).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: pip install "numpy<2" pandas scikit-learn scikit-surprise

      - name: Train SVD and export recommendations
        run: python scripts/export_static_recommendations.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          REACT_APP_STATIC: "1"
          PUBLIC_URL: /bookie

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
